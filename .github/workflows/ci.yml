name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test -- --coverage

  function-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-function
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ --cov=function_app --cov-report=term-missing

  e2e-tests:
    runs-on: ubuntu-latest
    # Promoted to merge-blocking: stable across every run since introduction
    # (multiple live runs against the deployed Function, 3/3 passing each
    # time, no flakiness observed).
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
