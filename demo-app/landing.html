<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BehaviorLens Demo</title>
<style>
  :root { --bg: #f9f9f7; --text: #0b0b0b; --muted: #52514e; --card: #fcfcfb; --border: rgba(11,11,11,0.1); --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --text: #f0efec; --muted: #c3c2b7; --card: #1a1a19; --border: rgba(255,255,255,0.1); --accent: #3987e5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { max-width: 560px; width: 100%; }
  h1 { margin: 0 0 0.25rem; }
  p { color: var(--muted); }
  a.card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-top: 0.75rem; color: inherit; text-decoration: none; }
  a.card strong { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>BehaviorLens</h1>
    <p>Lightweight behavioral analytics: JS SDK, Azure Functions, Databricks, Power BI and Gemini.</p>
    <a class="card" href="demo-app/index.html"><strong>ReportHub</strong><br />The instrumented demo app. Sign in and click around.</a>
    <a class="card" href="demo-app/live.html"><strong>BehaviorLens Live</strong><br />Watch events arrive in real time and ask questions of the data.</a>
  </main>
</body>
</html>
