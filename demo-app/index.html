<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReportHub</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e1e4ea;
    --text: #1d2330;
    --muted: #5d6677;
    --accent: #3b5bdb;
    --accent-soft: #e8edff;
    --danger: #c92a2a;
    --danger-soft: #fff0f0;
    --ok: #2b8a3e;
    --log-bg: #12151c;
    --log-text: #c6f6d5;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141a; --surface: #1a1e27; --border: #2c3240; --text: #e6e9ef; --muted: #9aa3b5;
      --accent: #7b93ff; --accent-soft: #232b45; --danger: #ff7b7b; --danger-soft: #3a1f22; --ok: #69db7c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141a; --surface: #1a1e27; --border: #2c3240; --text: #e6e9ef; --muted: #9aa3b5;
    --accent: #7b93ff; --accent-soft: #232b45; --danger: #ff7b7b; --danger-soft: #3a1f22; --ok: #69db7c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, input, select { font: inherit; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 0.5rem 0.9rem; min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 0.5rem 0.25rem; }
  input, select { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; background: var(--surface); color: var(--text); min-height: 40px; width: 100%; }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .muted { color: var(--muted); }

  .topbar { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; letter-spacing: 0.2px; }
  .badge { font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 57px); }
  .nav { background: var(--surface); border-right: 1px solid var(--border); padding: 0.75rem 0.5rem; display: flex; flex-direction: column; gap: 2px; }
  .nav a { color: var(--text); text-decoration: none; padding: 0.55rem 0.75rem; border-radius: 8px; white-space: nowrap; }
  .nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .help { margin-top: auto; color: var(--muted); }
  main { padding: 1.25rem; max-width: 980px; width: 100%; padding-bottom: 6rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1 1 200px; width: auto; }
  .row > select { flex: 0 1 200px; width: auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.8rem 1rem; }
  .kpi .value { font-size: 1.5rem; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  th { color: var(--muted); font-weight: 600; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }

  .auth { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  .auth .card { width: 100%; max-width: 400px; }
  .auth form { display: grid; gap: 0.6rem; }
  .notice { font-size: 0.85rem; background: var(--accent-soft); color: var(--text); border-radius: 8px; padding: 0.6rem 0.75rem; }
  .steps { display: flex; gap: 0.4rem; margin: 0.75rem 0 1rem; }
  .steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .steps span.done { background: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem 0.9rem; display: none; gap: 0.75rem; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 20; max-width: calc(100vw - 2rem); }
  .toast.show { display: flex; }
  .toast.error { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

  .debug { position: fixed; right: 1rem; bottom: 1rem; width: 380px; max-width: calc(100vw - 2rem); background: var(--log-bg); color: var(--log-text); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 10; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  .debug button { width: 100%; background: transparent; border: none; color: inherit; text-align: left; font: inherit; min-height: 36px; }
  #log { max-height: 230px; overflow-y: auto; padding: 0 0.75rem 0.6rem; }
  #log div { border-top: 1px solid #262b36; padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  .debug.collapsed #log { display: none; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .nav { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 0.4rem; }
    .nav .help { margin-top: 0; }
    main { padding: 1rem; padding-bottom: 7rem; }
    .debug { left: 1rem; right: 1rem; width: auto; bottom: 0.75rem; }
    .toast { bottom: 4.5rem; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button id="toast-action" class="primary" hidden>Retry</button>
  </div>
  <aside id="debug" class="debug">
    <button id="debug-toggle" aria-expanded="true">● BehaviorLens events (<span id="debug-count">0</span>) — tap to toggle</button>
    <div id="log"></div>
  </aside>

  <script src="../sdk/src/behaviorlens.js"></script>
  <script src="app.js"></script>
</body>
</html>
